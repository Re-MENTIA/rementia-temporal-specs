# ================================================
# Eldercare Detection System - Master Configuration
# ================================================
# This configuration file serves as the single source of truth for the entire system.
# All components should reference this configuration to eliminate hardcoding.

# ================================================
# System Configuration
# ================================================
system:
  name: "Eldercare Communication Analysis System"
  version: "2.0.0"
  description: "Modular detection system for analyzing eldercare communication patterns"
  environment: "production"  # development, testing, production
  
# ================================================
# Dataset Configuration
# ================================================
dataset:
  base_path: "datasets"
  encoding: "utf-8"
  cache_enabled: true
  cache_dir: ".cache/datasets"
  
# ================================================
# Detector Registry
# ================================================
# All detectors are registered here with their configurations
detectors:
  # Terms of Endearment Detector
  terms_of_endearment:
    enabled: true
    class_name: "TermsOfEndearmentDetector"
    module: "src.detectors.terms_of_endearment"
    type_key: "ToE"
    task_category: "elderspeak"
    description: "Detects infantilizing terms of endearment in eldercare communication"
    
  # Collective Instruction Detector  
  collective_instruction:
    enabled: true
    class_name: "CollectiveInstructionDetector"
    module: "src.detectors.collective_instruction"
    type_key: "collective"
    task_category: "elderspeak"
    description: "Detects inappropriate use of collective pronouns in instructions"
    
  # Episode Memory Detector
  episode_memory:
    enabled: true
    class_name: "EpisodeMemoryDetector"
    module: "src.detectors.episode_memory"
    type_key: "episode_memory"
    task_category: "episode_detection"
    description: "Detects references to episodic memory in conversations"
    
  # Open-End Question Detector
  open_end_question:
    enabled: true
    class_name: "OpenEndQuestionDetector"
    module: "src.detectors.open_end_question"
    type_key: "open_end"
    task_category: "question_detection"
    description: "Classifies questions as open-ended or closed-ended"
    
  # Long Speech Detector
  long_speech:
    enabled: true
    class_name: "LongSpeechDetector"
    module: "src.detectors.long_speech"
    type_key: "long_speech"
    task_category: "long_speech_detection"
    description: "Detects overly long or complex speech patterns"
    
  # Use Pronoun Detector (New)
  use_pronoun:
    enabled: true
    class_name: "UsePronounDetector"
    module: "src.detectors.use_pronoun"
    type_key: "use_pronoun"
    task_category: "pronoun_detection"
    description: "Detects vague pronoun usage that may confuse elderly individuals"

# ================================================
# Task-Specific Dataset Configurations
# ================================================
tasks:
  # Elderspeak Detection Tasks
  elderspeak:
    base_path: "datasets/Elderspeak"
    types:
      ToE:
        name: "Terms of Endearment"
        path: "ToE/terms_of_endearment_dataset_refined_v2.json"
        labels: ["0", "1"]  # 0=safe, 1=harmful
        label_field: "label"
        input_field: "text"
        
      collective:
        name: "Collective Instruction"
        path: "collective/collective_instruction_dataset.json"
        labels: ["0", "1"]  # 0=safe (non-collective/neutral), 1=harmful (collective)
        label_field: "instruction_type"
        input_field: "sentence"
        label_mapping:
          "non-collective": "0"
          "neutral": "0"
          "collective": "1"
  
  # Episode Detection Tasks
  episode_detection:
    base_path: "datasets/episode-open-end-Q"
    types:
      episode_memory:
        name: "Episode Memory Detection"
        path: "episode-memory/episode_memory_dataset.json"
        labels: ["0", "1"]  # 0=not episodic, 1=episodic
        label_field: "is_epsodic_memory_related"  # Note: typo in original dataset
        input_field: "sentence"
        label_mapping:
          "true": "1"
          "false": "0"
          "neutral": "0"
  
  # Question Detection Tasks
  question_detection:
    base_path: "datasets/episode-open-end-Q"
    types:
      open_end:
        name: "Open-End Question Detection"
        path: "open-end-Q/open_end_Q_dataset.json"
        labels: ["0", "1"]  # 0=closed-ended, 1=open-ended
        label_field: "question_type"
        input_field: "sentence"
        label_mapping:
          "open-ended": "1"
          "closed-ended": "0"
          "neutral": "0"  # Non-questions
  
  # Long Speech Detection Tasks
  long_speech_detection:
    base_path: "datasets/long-speech"
    types:
      long_speech:
        name: "Long Speech Detection"
        path: "long_speech_dataset.json"
        labels: ["0", "1"]  # 0=short/appropriate, 1=too long
        label_field: "is_too_long?"
        input_field: "sentences"
        label_mapping:
          "False": "0"
          "True": "1"
          
  # Pronoun Detection Tasks (New)
  pronoun_detection:
    base_path: "datasets/usePronoun"
    types:
      use_pronoun:
        name: "Vague Pronoun Detection"
        path: "use_pronoun_dataset.json"
        labels: ["0", "1"]  # 0=clear reference, 1=vague/confusing
        label_field: "label"
        input_field: "sentence"

# ================================================
# Model Configuration
# ================================================
models:
  # Default model for all detectors
  default: "gpt-4o-mini"
  
  # Available models with their configurations
  available:
    gpt-4o-mini:
      provider: "openai"
      max_tokens: 2
      temperature: 0
      timeout: 30
      cost_per_1k_tokens: 0.00015
      
    gpt-4o:
      provider: "openai"
      max_tokens: 2
      temperature: 0
      timeout: 30
      cost_per_1k_tokens: 0.0025
      
    gpt-4:
      provider: "openai"
      max_tokens: 2
      temperature: 0
      timeout: 30
      cost_per_1k_tokens: 0.03
      
  # Model-specific overrides for detectors
  detector_overrides:
    episode_memory: "gpt-4o-mini"
    long_speech: "gpt-4o-mini"
    
# ================================================
# API Configuration
# ================================================
api:
  openai:
    base_url: "https://api.openai.com/v1/chat/completions"
    rate_limit_delay: 0.1  # seconds between requests
    timeout: 30  # seconds
    max_retries: 3
    retry_delay: 1.0  # seconds
    
  # Additional API providers can be added here
  anthropic:
    base_url: "https://api.anthropic.com/v1/messages"
    rate_limit_delay: 0.2
    timeout: 30
    max_retries: 3

# ================================================
# Cross-Validation Configuration
# ================================================
cross_validation:
  # Standard cross-validation settings
  standard:
    n_folds: 3
    n_repeats: 3
    stratified: true
    random_seed_base: 42
    
  # Fast evaluation settings (for development)
  fast:
    n_folds: 2
    n_repeats: 1
    stratified: true
    random_seed_base: 42
    
  # Validation split for prompt optimization
  validation_split_ratio: 0.2
  
  # Parallel processing
  parallel:
    enabled: true
    max_workers: 4
    batch_size: 10

# ================================================
# TextGrad Optimization Configuration
# ================================================
textgrad_optimization:
  enabled: true
  
  # Optimization engine settings
  engine:
    provider: "openai"
    model: "gpt-4o"
    temperature: 0.7
    max_tokens: 1000
    
  # Optimization parameters
  parameters:
    max_iterations: 5
    learning_rate: 0.1
    convergence_threshold: 0.01
    early_stopping_patience: 2
    
  # Validation settings
  validation:
    samples_per_iteration: 20
    min_samples: 10
    stratified: true
    
  # Performance thresholds
  thresholds:
    accuracy: 0.95
    recall: 0.80
    precision: 0.90
    f1_score: 0.85
    
  # Optimization strategies per detector
  detector_strategies:
    terms_of_endearment:
      focus_metric: "recall"
      max_iterations: 3
      
    collective_instruction:
      focus_metric: "precision"
      max_iterations: 5
      
    episode_memory:
      focus_metric: "f1_score"
      max_iterations: 4
      
    use_pronoun:
      focus_metric: "accuracy"
      max_iterations: 3

# ================================================
# Prompt Templates
# ================================================
prompts:
  # Base template for all detectors
  base_template: |
    You are an expert in analyzing eldercare communication patterns.
    Your task is to detect specific patterns that may be inappropriate or harmful.
    
    {task_description}
    
    {guidelines}
    
    {examples}
    
    Analyze the text and respond with ONLY "{positive_label}" or "{negative_label}".
    
  # Detector-specific prompts
  ToE:
    initial: |
      You are an expert in analyzing eldercare communication for inappropriate terms of endearment.

      Detect if text contains terms that infantilize elderly care recipients:
      - Pet names (honey, sweetie, darling, sugar, baby, ちゃん suffix)
      - Baby talk ("good boy/girl", "cutie", いい子, えらい)
      - Patronizing tone treating adults as children
      - Infantilizing expressions (よしよし, なでなで, あーん)

      Appropriate communication uses:
      - Respectful titles (Mr./Mrs./Ms. + surname, -san, -sama, 様)
      - Professional, dignified language

      Examples:
      - "山田ちゃん、いい子だね" → 1 (infantilizing)
      - "山田さん、お薬の時間です" → 0 (respectful)
      - "よしよし、えらいね" → 1 (baby talk)
      - "お疲れ様でした" → 0 (professional)

      Analyze the text and respond with ONLY "1" (harmful) or "0" (safe).
  
  collective:
    initial: |
      You are an expert in analyzing eldercare communication for collective instruction patterns.

      COLLECTIVE INSTRUCTION: The inappropriate use of inclusive first-person plural pronouns ("we", "us", "our", "let's", "私たち", "一緒に") when giving instructions where the speaker is not necessary for the action but uses collective language to manipulate or soften commands. This includes using phrases like "私のために" (for my sake) or "私も心配だから" (because I'm worried too) to make the care recipient feel obligated to comply.

      Key features of collective instruction:
      - Uses "we/us/our/let's" or "私たち/一緒に" when speaker won't actually participate
      - Uses emotional manipulation like "私のために" or "私も" to create false solidarity
      - The action could/should be done independently by the care recipient
      - Masks individual directives as shared activities
      - Undermines autonomy by implying dependency

      NON-COLLECTIVE: Direct instructions using appropriate pronouns
      - Uses "you" or polite forms ("あなた", "〜てください")
      - Clear about who performs the action
      - Respects individual autonomy

      NEUTRAL: Non-instructional text
      - Descriptions, observations, or general statements
      - No commands or directives present

      Examples:
      Collective:
      - "私たちで今夜の献立を決めましょうか" → collective (speaker won't actually decide together)
      - "Let's take our medicine now" → collective (only patient takes medicine)
      - "一緒に深呼吸をしてみましょう" → collective (masking instruction)
      
      Non-collective:
      - "お薬を飲んでください" → non-collective (direct, respectful)
      - "Please close the window" → non-collective (clear instruction)
      
      Neutral:
      - "今日は良い天気です" → neutral (observation)
      - "The flowers are blooming" → neutral (description)

      Analyze the text and respond with ONLY "1" (collective instruction detected) or "0" (safe - non-collective or neutral).
  
  episode_memory:
    initial: |
      You are an expert in cognitive neuroscience, specializing in memory classification.

      EPISODIC MEMORY: Personal memories of specific events that an individual has experienced. The key characteristic is that these memories contain not only "what" happened, but also the integrated contextual details of "when," "where," and "in what situation" the event occurred. These are autobiographical experiences tied to specific spatiotemporal contexts.

      Key features of episodic memory:
      - Personal experience (first-person perspective)
      - Specific time and place
      - Contextual details (emotions, sensory details, situations)
      - Autobiographical nature

      NON-EPISODIC MEMORY includes:
      - Semantic memory: General knowledge, facts, vocabulary (context-independent)
      - Procedural memory: Skills, habits, how-to knowledge
      - Future plans, speculations, hypothetical scenarios
      - General observations without personal experience

      EXAMPLES:

      Episodic memory (return "1"):
      - "I still remember taking a photo at the school gate on my elementary school entrance ceremony day" → 1 (specific personal event with clear time/place)
      - "去年のクリスマスに家族で旅行した時のことを覚えている？" → 1 (personal experience with temporal marker)
      - "The excitement and anxiety I felt on my first airplane ride" → 1 (personal experience with emotions)
      - "昨日の会議でみんなからどんな意見が出たか、覚えてる？" → 1 (specific recent event)

      Non-episodic memory (return "0"):
      - "Mt. Fuji is the highest mountain in Japan" → 0 (semantic memory - general fact)
      - "地球が太陽の周りを回る周期は約365日です" → 0 (scientific knowledge)
      - "Once you learn how to ride a bicycle, you never forget" → 0 (procedural memory)
      - "It might rain today" → 0 (future speculation)
      - "A new cafe opened recently" → 0 (general observation without personal experience)

      Analyze the sentence and respond with ONLY "1" (episodic memory) or "0" (non-episodic memory).
  
  open_end:
    initial: |
      You are an expert in question classification and conversational analysis.

      OPEN-ENDED QUESTIONS: Questions that allow respondents to answer freely in their own words without restricting the range of possible responses. These questions encourage detailed, elaborative answers and personal opinions or experiences.

      Key features of open-ended questions:
      - No predetermined answer choices
      - Require explanation, description, or opinion
      - Often start with "What," "How," "Why," or "Tell me about..."
      - Encourage detailed responses
      - Allow for unexpected or creative answers

      CLOSED-ENDED QUESTIONS: Questions that require specific, limited responses such as YES/NO, predetermined choices, or numerical values. These questions have a restricted range of possible answers.

      Key features of closed-ended questions:
      - Limited answer options (YES/NO, multiple choice, scales)
      - Quick, specific responses expected
      - Often start with "Do," "Is," "Have," "Will," "Can"
      - Binary choices or selections from given options
      - Factual, confirmatory nature

      NEUTRAL STATEMENTS: Sentences that are not questions at all - they are declarations, observations, or statements of fact.

      EXAMPLES:

      Open-ended questions (return "1"):
      - "最近のニュースで気になったことは何ですか？" → 1 (asks for personal thoughts)
      - "How do you usually spend your weekends?" → 1 (requires descriptive answer)
      - "趣味は何ですか？" → 1 (allows various responses)
      - "What makes you happiest in life?" → 1 (encourages reflection)
      - "どんな音楽をよく聴きますか？" → 1 (open to elaboration)

      Closed-ended questions (return "0"):
      - "ニュースはもう見ましたか？" → 0 (YES/NO question)
      - "Do you like sports?" → 0 (YES/NO expected)
      - "コーヒーと紅茶では、どちらが好きですか？" → 0 (binary choice)
      - "明日の会議に出席できますか？" → 0 (YES/NO response)
      - "Is today's weather nice?" → 0 (YES/NO answer)

      Neutral statements (return "0"):
      - "今日は本当に暑い一日だ。" → 0 (statement, not a question)
      - "Technology is advancing rapidly." → 0 (observation)
      - "彼は毎晩11時には寝る習慣がある。" → 0 (factual statement)
      - "The new cafe opened last week." → 0 (information)

      Analyze the sentence and respond with ONLY "1" (open-ended question) or "0" (closed-ended question or non-question).
  
  long_speech:
    initial: |
      You are an expert in cognitive accessibility and eldercare communication.

      TASK: Detect if a sentence is too long or complex for individuals with cognitive impairments.

      LONG/COMPLEX SENTENCES (return "1"):
      - Multiple clauses or ideas combined in one sentence
      - Contains multiple instructions or pieces of information
      - Requires processing several concepts simultaneously
      - Uses complex conjunctions or conditional statements
      - Length makes it difficult to remember the beginning by the end

      SHORT/SIMPLE SENTENCES (return "0"):
      - Single, clear idea or instruction
      - Direct and concise communication
      - Easy to process and remember
      - One action or concept at a time
      - Appropriate length for cognitive accessibility

      EXAMPLES:

      Too Long/Complex (return "1"):
      - "今日は晴れて気温も高いので帽子をかぶって水分をしっかり取りませんか？" → 1 (multiple instructions)
      - "駅前の道が工事中で迂回が必要だから、早めに家を出て余裕を持ったほうがいいよね？" → 1 (complex reasoning)
      - "図書館で調べ物を、済ませたら、向かいのカフェで休憩して、そのあと映画を観に行きませんか？" → 1 (sequential activities)

      Short/Simple (return "0"):
      - "すごく、今日は、暑いね。" → 0 (single observation)
      - "コーヒー飲む？" → 0 (simple question)
      - "ドア閉めて。" → 0 (single instruction)
      - "今日は暑いですね。元気ですか？" → 0 (simple inquiry)

      Analyze the sentence and respond with ONLY "1" (too long/complex) or "0" (short/simple).
      
  use_pronoun:
    initial: |
      You are an expert in analyzing eldercare communication for vague pronoun usage.

      VAGUE PRONOUN USAGE: The use of demonstrative pronouns (this, that, these, those, it, here, there, これ、それ、あれ、ここ、そこ、あそこ) without clear antecedents or in contexts where elderly individuals with cognitive impairments might struggle to understand the reference.

      Key features of vague pronoun usage:
      - Uses "it", "this", "that", "there" without clear reference
      - Uses Japanese demonstratives (これ、それ、あれ) unclearly
      - Assumes shared context that may not exist
      - Creates ambiguity about what is being referenced
      - May cause confusion for those with memory issues

      CLEAR COMMUNICATION: Direct references using specific nouns
      - Names specific objects, places, or actions
      - Provides clear context
      - Avoids ambiguous references
      - Supports cognitive clarity

      Examples:
      Vague (return "1"):
      - "さあ、これを全部飲みましょうね。" → 1 (unclear what "これ" refers to)
      - "Take that over there, please." → 1 (unclear "that" and "there")
      - "そこに座ってお待ちください。" → 1 (unclear where "そこ" is)
      
      Clear (return "0"):
      - "お薬を全部飲みましょうね。" → 0 (specific reference)
      - "Take the blue cup on the table, please." → 0 (clear references)
      - "椅子に座ってお待ちください。" → 0 (specific location)

      Analyze the text and respond with ONLY "1" (vague pronoun usage) or "0" (clear communication).

# ================================================
# Output Configuration
# ================================================
output:
  # Results directory structure
  results_dir: "results"
  subdirectories:
    raw_results: "raw"
    processed_results: "processed"
    visualizations: "visualizations"
    reports: "reports"
    
  # Checkpoint configuration
  checkpoint:
    enabled: true
    directory: "checkpoints"
    auto_resume: true
    save_frequency: 100  # Save every N evaluations
    
  # Prediction saving
  predictions:
    save_all: false
    save_errors: true
    max_to_save: 50
    include_confidence: true
    
  # Report generation
  reports:
    formats: ["json", "csv", "markdown", "html"]
    include_visualizations: true
    include_confusion_matrix: true
    include_per_fold_results: true

# ================================================
# Logging Configuration
# ================================================
logging:
  # General logging settings
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  date_format: "%Y-%m-%d %H:%M:%S"
  
  # File logging
  file:
    enabled: true
    path: "logs/eldercare_detection.log"
    max_size_mb: 10
    backup_count: 5
    
  # Console logging
  console:
    enabled: true
    colored: true
    
  # Component-specific logging levels
  component_levels:
    data_loader: "INFO"
    detector: "INFO"
    optimizer: "DEBUG"
    evaluator: "INFO"
    api_client: "WARNING"

# ================================================
# Streamlit UI Configuration
# ================================================
streamlit:
  # Page configuration
  page:
    title: "Eldercare Communication Analyzer"
    icon: "🏥"
    layout: "wide"
    initial_sidebar_state: "expanded"
    
  # UI components
  components:
    show_raw_results: true
    show_confidence_scores: true
    show_detection_explanations: false
    enable_batch_analysis: true
    enable_real_time_analysis: true
    
  # Visualization settings
  visualizations:
    color_scheme:
      harmful: "#ff4444"
      safe: "#44ff44"
      neutral: "#ffaa44"
    chart_height: 400
    show_statistics: true
    
  # Performance settings
  cache:
    enabled: true
    ttl_seconds: 3600
    max_entries: 1000

# ================================================
# Data Loader Configuration
# ================================================
data_loader:
  # Abstraction layer settings
  abstract_interface:
    enforce_schema: true
    validate_labels: true
    auto_normalize: true
    
  # Schema definitions
  schemas:
    default:
      text_field: "text"
      label_field: "label"
      metadata_fields: ["id", "source", "timestamp"]
      
  # Preprocessing
  preprocessing:
    lowercase: false
    strip_whitespace: true
    remove_empty: true
    max_length: 1000
    
  # Augmentation options
  augmentation:
    enabled: false
    strategies: ["paraphrase", "translation_back"]
    augmentation_factor: 2

# ================================================
# Evaluation Metrics Configuration
# ================================================
metrics:
  # Primary metrics
  primary: ["accuracy", "f1_score", "recall", "precision"]
  
  # Additional metrics
  additional: ["specificity", "balanced_accuracy", "mcc", "auc_roc"]
  
  # Confidence intervals
  confidence_intervals:
    enabled: true
    confidence_level: 0.95
    method: "bootstrap"
    n_bootstrap: 1000
    
  # Per-class metrics
  per_class:
    enabled: true
    average: "weighted"  # micro, macro, weighted

# ================================================
# Advanced Configuration
# ================================================
advanced:
  # Memory management
  memory:
    batch_processing: true
    batch_size: 100
    gc_frequency: 1000
    
  # Error handling
  error_handling:
    continue_on_error: true
    max_retries: 3
    retry_backoff: "exponential"
    
  # Performance optimization
  optimization:
    use_caching: true
    parallel_processing: true
    vectorized_operations: true
    
  # Debugging
  debugging:
    save_intermediate_results: false
    profile_performance: false
    trace_api_calls: false